version: "3.8"

services:
  # Single service - Backend serves both API and React frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-pulse-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - NEWS_API_KEY=${NEWS_API_KEY}
      - LOG_LEVEL=info
      - CACHE_TTL_MINUTES=15
      - CACHE_CLEANUP_INTERVAL_MINUTES=30
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=60000
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  app-logs:
    driver: local
